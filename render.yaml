services:
  - type: web
    name: univ-collab-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: pnpm install && pnpm prisma generate && pnpm build
    preDeployCommand: pnpm prisma db push
    startCommand: node dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: EMAIL_PROVIDER_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        value: onboarding@resend.dev
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: UNIVERSITY_EMAIL_DOMAINS
        value: university.edu
